# ============================================================
# D AI Assistant — Docker Compose (dev)
# ============================================================
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: d_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: d_user
      POSTGRES_PASSWORD: d_password
      POSTGRES_DB: d_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d_user -d d_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: d_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  pgdata:
